# SchoolLms — prod: app (API + SPA) + PostgreSQL + Cloudflare Tunnel.
# Sozlamalar .env faylidan keladi (.env.example dan nusxa oling).
# Diqqat: app porti TASHQARIGA OCHILMAGAN — unga faqat cloudflared (ichki tarmoq) kiradi.

# Log rotatsiyasi. Docker'ning standart `json-file` drayveri loglarni CHEKSIZ o'stiradi —
# oylar davomida ishlagan serverda bu diskni to'ldirib, butun stack'ni to'xtatadi. Har xizmatga
# 10 MB x 3 fayl chegarasi (jami ≈30 MB/xizmat).
# Rollback: xizmatdan `logging: *default-logging` qatorini olib tashlash.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── BAZA ── PostgreSQL. Barcha ma'lumot shu yerda. Tashqariga chiqmaydi.
  database:
    image: postgres:17-alpine
    container_name: wunderkind-database
    environment:
      POSTGRES_DB: "schoollms"
      POSTGRES_USER: "schoollms"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      # Kirill/lotin tartiblash uchun
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Rol ajratish (SPEC §4.1). init-roles.sql shu ikki o'zgaruvchini `\getenv` bilan
      # o'qiydi — parollar SQL fayl ichida SAQLANMAYDI. Skriptni qo'lda qayta ishga
      # tushirganda ham (migratsiyadan keyin) shular ishlatiladi.
      APP_DB_PASSWORD: "${DB_APP_PASSWORD}"
      MIGRATOR_DB_PASSWORD: "${DB_MIGRATOR_PASSWORD}"
      # `app_ro` — READ-ONLY role of the MCP (AI client) tools. Optional: empty = role not
      # created and the MCP server stays off (docs/MCP.md).
      RO_DB_PASSWORD: "${DB_RO_PASSWORD:-}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-backups:/backups
      # FAQAT bo'sh bazada avtomatik bajariladi (postgres entrypoint qoidasi).
      # Mavjud bazaga qo'lda qo'llash kerak — deploy/README.md ga qarang.
      # Rollback: shu qatorni olib tashlang; mavjud rollar saqlanib qoladi.
      - ./deploy/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoollms -d schoollms"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # ── KESH ── Redis. Faqat kam o'zgaradigan ma'lumotlar keshi (portal meta, fan/o'qituvchi
  # nomlari). MANBA EMAS — butunlay yo'qolsa ham ma'lumot yo'qolmaydi, faqat DB yuki oshadi.
  # Tashqariga port OCHILMAGAN — unga faqat backend (ichki tarmoq) kiradi.
  cache:
    image: redis:7-alpine
    container_name: wunderkind-cache
    # maxmemory + LRU: kesh RAM'ni cheksiz yeb qo'ymasin (3 GB serverda muhim).
    # appendonly yoqilgan — restartdan keyin issiq kesh saqlanadi (majburiy emas, lekin foydali).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ── BACKEND + FRONTEND ── .NET API (/api/*) va qurilgan React sayti bitta obrazda:
  # frontend build vaqtida wwwroot ga joylanadi, shuning uchun alohida konteyner kerak emas.
  backend:
    build:
      context: .
      args:
        VITE_ROOT_DOMAIN: "${ROOT_DOMAIN}"   # frontend subdomenni shu domenga nisbatan aniqlaydi
        VITE_USE_MOCK: "false"
    container_name: wunderkind-backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # ── ULANISH SATRLARI — IKKITA, ATAYLAB (SPEC §4.1) ──
      # Default = `app_rw`: ilova shu rol bilan ishlaydi. U HECH NARSAGA EGA EMAS,
      # shuning uchun `REVOKE` unga HAQIQATAN ta'sir qiladi (jadval egasiga qilmaydi —
      # bu serverda amaliy sinovdan o'tkazilgan).
      # Bu qatorni `schoollms` ga qaytarsangiz — moliyaviy himoya JIMGINA yo'qoladi.
      # Maximum Pool Size=40: server Postgres max_connections=60 (docker-compose.server.yml) —
      # 40 (app_rw) + 8 (app_ro, MCP) + migrator/backup/psql/superuser reserve must fit.
      ConnectionStrings__Default: "Host=database;Port=5432;Database=schoollms;Username=app_rw;Password=${DB_APP_PASSWORD};Include Error Detail=true;Maximum Pool Size=40"
      # Migrator = `schoollms_owner`: sxema egasi, FAQAT migratsiya uchun.
      # Berilmasa ilova Default ga qaytadi (dev qulayligi) — prodda IKKALASI ham shart.
      ConnectionStrings__Migrator: "Host=database;Port=5432;Database=schoollms;Username=schoollms_owner;Password=${DB_MIGRATOR_PASSWORD};Include Error Detail=true"
      # Redis kesh. Bu qatorni o'chirsangiz — ilova jarayon ichidagi xotira keshiga qaytadi
      # (qayta build SHART EMAS). Rollback shu qadar oddiy.
      ConnectionStrings__Redis: "cache:6379"
      # Read-only MCP server for AI clients (docs/MCP.md). `app_ro` = SELECT only. Built ONLY
      # when DB_RO_PASSWORD is set; empty string = MCP endpoint off (fail-closed), app unaffected.
      # No "Include Error Detail" (it can echo row data into logs); the app also enforces pool ≤ 8,
      # timeouts and a read-only session option itself (McpReadOnlyConnection.Harden).
      ConnectionStrings__ReadOnly: "${DB_RO_PASSWORD:+Host=database;Port=5432;Database=schoollms;Username=app_ro;Password=${DB_RO_PASSWORD};Maximum Pool Size=8;Timeout=5;Command Timeout=30}"
      # OAuth issuer / public /mcp URL. REQUIRED outside Development, else MCP stays off.
      # Server: docker-compose.server.yml sets it; local: MCP_PUBLIC_BASE_URL in .env.
      Mcp__PublicBaseUrl: "${MCP_PUBLIC_BASE_URL:-}"
      Tenancy__RootDomain: "${ROOT_DOMAIN}"
      App__Host: "test.${ROOT_DOMAIN}"     # FAQAT shu host ilovani (SPA) ochadi; qolganlari → landing
      Jwt__Key: "${JWT_KEY}"               # >=32 belgi; prod'da MAJBURIY
      # Gemini (AI): dars tahlili xulosasi va HR topshiriq loyihalari (docs/modules/hr-ai-tasks.md).
      # .env dagi GEMINI_API_KEY — PULLIK tarifdagi kalit (xodimlar ma'lumoti boradi). Bo'sh = AI o'chiq.
      # 2026-10-27 gacha bu qator yo'q edi — .env ga kalit yozilsa ham ilova uni ko'rmasdi.
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      # Bo'sh = koddagi standart model. Google eski modelni yopsa, .env da GEMINI_MODEL=... + compose up.
      Gemini__Model: "${GEMINI_MODEL:-}"
      # Asosiy model band (503) yoki yopilgan (404) bo'lsa so'raladigan zaxira. Bo'sh = koddagi standart.
      Gemini__FallbackModel: "${GEMINI_FALLBACK_MODEL:-}"
      # "Chatbot" menyusi (docs/modules/chatbot.md §3): chatbot paneliga bir martalik kirish tokeni
      # shu kalit bilan imzolanadi. Bo'sh = menyu "Chatbot hali ulanmagan" deydi.
      Chatbot__SsoKey: "${CHATBOT_SSO_KEY:-}"
    volumes:
      - uploads:/app/uploads               # yuklangan fayllar (rasm, hujjat) saqlanadi
      - dpkeys:/app/keys                    # DataProtection kalitlari — deploylar oralig'ida saqlanadi
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      # /api/health bazaga ham so'rov yuboradi — ya'ni "jarayon tirik" emas, "ilova ishlayapti".
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    # Diqqat: bu yerda `ports:` YO'Q — internetga ochilmaydi.

  # Kamera media-shlyuzi: IP kameralar RTSP oqimini brauzer ko'radigan HLS ga o'giradi,
  # 24/7 yozib boradi (playback + qirqib yuklab olish uchun). Tashqariga OCHILMAGAN —
  # unga faqat `app` (ichki tarmoq) kiradi; brauzer app proksi orqali ko'radi.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: schoollms-mediamtx
    environment:
      MTX_API: "yes"                 # konfiguratsiya API (:9997) — app kamera yo'llarini qo'shadi
      MTX_HLS: "yes"                 # jonli HLS (:8888)
      MTX_PLAYBACK: "yes"            # yozuvdan playback/clip (:9996)
      MTX_HLSVARIANT: "mpegts"       # oddiy .ts segmentlar — proksilash oson
      MTX_PATHDEFAULTS_RECORDPATH: "/recordings/%path/%Y-%m-%d_%H-%M-%S-%f"
    volumes:
      - cam-recordings:/recordings   # kamera yozuvlari (playback manbai)
    restart: unless-stopped
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: schoollms-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"      # Cloudflare Zero Trust → Tunnels → token
      # QUIC (UDP) edge ulanishi tez-tez uzilib ("no recent network activity") tunnel butunlay
      # tushib qolardi → 5xx. HTTP/2 (TCP) ga o'tkazamiz — bu tarmoqda barqarorroq.
      TUNNEL_TRANSPORT_PROTOCOL: "http2"
    depends_on:
      backend:
        condition: service_healthy   # tunnel backend TAYYOR bo'lgandan keyin ochiladi (502 kamayadi)
    restart: unless-stopped
    logging: *default-logging

  # ── CHATBOT ── Instagram/Telegram AI sotuv agenti (docs/modules/chatbot.md). Alohida Python
  # servis, `chatbot/` papkasidan. `chatbot` profili ortida: oddiy `up` uni ISHGA TUSHIRMAYDI —
  # eski serverdagi nusxa to'xtatilmaguncha ikkinchisi mijozlarga ikki marta javob yozardi.
  # Yoqish: `--profile chatbot`. Baza — shu PostgreSQL'dagi alohida `wk_agent` bazasi va rol.
  chatbot-backend:
    profiles: ["chatbot"]
    build: ./chatbot/backend
    container_name: wunderkind-chatbot
    environment:
      DATABASE_URL: "postgresql+asyncpg://wk_agent:${CHATBOT_DB_PASSWORD}@database:5432/wk_agent"
      REDIS_URL: "redis://chatbot-redis:6379/0"
      # Bazadagi sirlar (AI/Instagram/Telegram kalitlari) shu kalit bilan shifrlangan — eski
      # serverdagi qiymat AYNAN ko'chirilishi shart, aks holda ular o'qilmay qoladi.
      SECRET_KEY: "${CHATBOT_SECRET_KEY}"
      PUBLIC_URL: "${CHATBOT_PUBLIC_URL:-}"
      ADMIN_USERNAME: "${CHATBOT_ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${CHATBOT_ADMIN_PASSWORD:-}"
      LMS_SSO_KEY: "${CHATBOT_SSO_KEY:-}"
      TIMEZONE: "${CHATBOT_TIMEZONE:-Asia/Tashkent}"
    depends_on:
      database:
        condition: service_healthy
      chatbot-redis:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  # Chatbot paneli (SPA, /chatbot/ ostida) + uning ommaviy yo'llari (webhook, OAuth, formalar).
  # Tashqariga ochilmaydi — unga `proxy` (Caddy) kiradi.
  chatbot-web:
    profiles: ["chatbot"]
    build:
      context: ./chatbot/frontend
      args:
        VITE_BASE: "/chatbot/"
        CADDYFILE: "Caddyfile.lms"
    container_name: wunderkind-chatbot-web
    environment:
      PANEL_URL: "${CHATBOT_PANEL_URL:-/chatbot/}"
    depends_on:
      - chatbot-backend
    restart: unless-stopped
    logging: *default-logging

  # Chatbotning o'z Redis'i: suhbat holati va chastota hisoblagichlari. LMS keshi `allkeys-lru`
  # — u bu kalitlarni siqib chiqarardi, shuning uchun alohida.
  chatbot-redis:
    profiles: ["chatbot"]
    image: redis:7-alpine
    container_name: wunderkind-chatbot-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - chatbot-redis-data:/data
    restart: unless-stopped
    logging: *default-logging

  # Kunlik avtomatik backup. Har kuni BACKUP_HOUR (UTC) da BARCHA foydalanuvchi bazalarini
  # /backups ga .bak qilib oladi va BACKUP_RETENTION_DAYS dan eski nusxalarni o'chiradi.
  # Kunlik avtomatik backup. Har kuni BACKUP_HOUR (UTC) da bazani /backups ga .dump qilib
  # oladi va BACKUP_RETENTION_DAYS dan eski nusxalarni o'chiradi.
  backup:
    image: postgres:17-alpine
    container_name: wunderkind-backup
    environment:
      PGHOST: database
      PGUSER: schoollms
      PGPASSWORD: "${DB_PASSWORD}"
      PGDATABASE: schoollms
      BACKUP_HOUR: "21"            # 21:00 UTC = 02:00 Toshkent
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - pg-backups:/backups
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] xizmat ishga tushdi; har kuni $${BACKUP_HOUR}:00 UTC, saqlash $${BACKUP_RETENTION_DAYS} kun"
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "today $${BACKUP_HOUR}:00" +%s 2>/dev/null || date -u +%s)
          [ "$$next" -le "$$now" ] && next=$$(( next + 86400 ))
          sleep $$(( next - now ))
          ts=$$(date -u +%Y%m%d_%H%M)
          echo "[backup] $$ts — boshlandi"
          pg_dump --format=custom --file="/backups/schoollms_$${ts}.dump" && echo "[backup] tayyor" || echo "[backup] XATO"
          # Chatbot bazasi (docs/modules/chatbot.md) — bo'lsa, u ham.
          if psql -tAc "select 1 from pg_database where datname = 'wk_agent'" | grep -q 1; then
            pg_dump --format=custom --dbname=wk_agent --file="/backups/wk_agent_$${ts}.dump" && echo "[backup] chatbot tayyor" || echo "[backup] chatbot XATO"
          fi
          find /backups -name '*.dump' -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete
        done

volumes:
  pg-data:
  redis-data:
  uploads:
  dpkeys:
  pg-backups:
  cam-recordings:
  chatbot-redis-data:
